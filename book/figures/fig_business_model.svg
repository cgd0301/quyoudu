<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="图 17 商业模式对比矩阵">
<rect x="0" y="0" width="1000" height="470" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
<text x="40" y="46" font-size="22" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">图 17 商业模式对比矩阵</text>
<text x="40" y="72" font-size="13" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">三条候选路径的证据状态与首个验证动作</text>
<rect x="20" y="104" width="150" height="32" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="28" y="125" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">维度</text>
<rect x="170" y="104" width="270" height="32" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="178" y="125" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">P1 机构场景服务</text>
<rect x="440" y="104" width="270" height="32" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="448" y="125" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">P2 用户按次付费</text>
<rect x="710" y="104" width="270" height="32" rx="3" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="718" y="125" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">P3 场馆/票务合作</text>
<rect x="20" y="136" width="150" height="34" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="28" y="157" font-size="10" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">付费方</text>
<rect x="170" y="136" width="270" height="34" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="178" y="157" font-size="10" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">银行场景运营预算</text>
<rect x="440" y="136" width="270" height="34" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="448" y="157" font-size="10" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">用户本人</text>
<rect x="710" y="136" width="270" height="34" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="718" y="157" font-size="10" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">场馆／票务方</text>
<rect x="20" y="170" width="150" height="34" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="28" y="191" font-size="10" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">提供价值</text>
<rect x="170" y="170" width="270" height="34" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="178" y="191" font-size="10" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">消费决策前的中立可行性判断</text>
<rect x="440" y="170" width="270" height="34" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="448" y="191" font-size="10" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">单次任务的资金规划与比较</text>
<rect x="710" y="170" width="270" height="34" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="718" y="191" font-size="10" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">购前预检与退改客诉前移</text>
<rect x="20" y="204" width="150" height="34" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="28" y="225" font-size="10" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">所需条件</text>
<rect x="170" y="204" width="270" height="34" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="178" y="225" font-size="10" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">内部立项、数据合规、话术审核</text>
<rect x="440" y="204" width="270" height="34" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="448" y="225" font-size="10" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">支付与退款流程、流量</text>
<rect x="710" y="204" width="270" height="34" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="718" y="225" font-size="10" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">商务合作、不改变排序</text>
<rect x="20" y="246" width="150" height="34" rx="0" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="28" y="267" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1d4ed8">当前证据</text>
<rect x="170" y="246" width="270" height="34" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="178" y="267" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">有机构采购软件的公开记录；未发现采购个人预算产品</text>
<rect x="440" y="246" width="270" height="34" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="448" y="267" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">8/30 任何付费形式（按次 5/30）</text>
<rect x="710" y="246" width="270" height="34" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="718" y="267" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">未取得此类合作的公开定价或案例</text>
<rect x="20" y="280" width="150" height="34" rx="0" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="28" y="301" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1d4ed8">状态</text>
<rect x="170" y="280" width="270" height="34" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="178" y="301" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">候选假设，无合作</text>
<rect x="440" y="280" width="270" height="34" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="448" y="301" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">可测试候选，无价格</text>
<rect x="710" y="280" width="270" height="34" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="718" y="301" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">探索，无商务接触</text>
<rect x="20" y="314" width="150" height="34" rx="0" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="28" y="335" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1d4ed8">首个验证动作</text>
<rect x="170" y="314" width="270" height="34" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="178" y="335" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">机构访谈：确认真实需求与合规边界</text>
<rect x="440" y="314" width="270" height="34" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="448" y="335" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">价格点测试 + 观察真实支付</text>
<rect x="710" y="314" width="270" height="34" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="718" y="335" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">商务访谈：确认不因合作方改变排序</text>
<text x="20" y="380" font-size="12" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">三条路径都没有收入、合同或用户；表里没有“已验证”一列，因为一个都没有。差别只在验证成本与前置条件。</text>
<text x="20" y="404" font-size="12" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">读法：P1 是“先问机构”而不是“银行已愿意买”；P2 是“可以测试付费”而不是“8/30 会付费”；P3 是“场景相关”而不是“已有合作”。</text>
<text x="20" y="428" font-size="12" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">本稿不写收入、付费率、获客成本或盈亏平衡：五个输入（单价、频次、token 用量、汇率、固定成本）都缺实测。</text>
<text x="40" y="454" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">证据状态取自本项目问卷与公开来源｜不含收入、付费率与获客成本预测</text>
</svg>
