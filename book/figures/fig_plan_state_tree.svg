<text x="40" y="46" font-size="22" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">图 23 三类状态与计划状态取值</text>
<text x="40" y="72" font-size="13" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">计划、优化、确认状态分开保存</text>
<rect x="60" y="140" width="250" height="80" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="185" y="170" font-size="15" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="bold" fill="#1d4ed8">计划状态</text>
<text x="185" y="194" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="normal" fill="#6b7280">按已确认方案 &gt; 选中候选 &gt; 草案</text>
<text x="185" y="212" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="normal" fill="#6b7280">D47、D20</text>
<rect x="380" y="140" width="250" height="80" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="505" y="170" font-size="15" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="bold" fill="#1d4ed8">优化状态</text>
<text x="505" y="194" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="normal" fill="#6b7280">K=3 范围内的比较结论</text>
<text x="505" y="212" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="normal" fill="#6b7280">R011、R016</text>
<rect x="700" y="140" width="250" height="80" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="825" y="170" font-size="15" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="bold" fill="#1d4ed8">确认状态</text>
<text x="825" y="194" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="normal" fill="#6b7280">待确认 / 已确认 / 草案</text>
<text x="825" y="212" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="middle" font-weight="normal" fill="#6b7280">R017、D18</text>
<rect x="60" y="270" width="880" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="80" y="300" font-size="13" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">计划状态取值（rules.md §11.1；优先级由高到低）</text>
<text x="100" y="330" font-size="12" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">· FEASIBLE_UNDER_ASSUMPTIONS 按当前假设可行</text>
<text x="100" y="354" font-size="12" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">· INCOMPLETE 暂无法完整判断</text>
<text x="100" y="378" font-size="12" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">· PAYMENT_GAP 发现付款缺口</text>
<text x="100" y="402" font-size="12" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">· CONSTRAINT_ISSUE 存在约束问题</text>
<text x="100" y="426" font-size="12" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">· CANCELLED 已取消</text>
<text x="60" y="480" font-size="12" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">三类状态分别保存，不互相覆盖；取消与暂停不改底层检查口径（D19、D47）。</text>
<text x="40" y="544" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">结构图：按 docs/rules.md 与仓库现有目录/代码人工整理，非引擎导出</text>
</svg>
