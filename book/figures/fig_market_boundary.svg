<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-label="图 16 市场证据边界">
<rect x="0" y="0" width="1000" height="570" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
<text x="40" y="46" font-size="22" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">图 16 市场证据边界</text>
<text x="40" y="72" font-size="13" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">行业金额、人次、在校生规模与软件收入不是同一概念</text>
<rect x="40" y="108" width="280" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="40" y="108" width="6" height="36" rx="0" fill="#047857" stroke="#047857" stroke-width="1.2"/>
<text x="54" y="124" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">大型演出观众人次</text>
<text x="54" y="138" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">2025 年 5000 人以上 4338.58 万人次（协会简报）</text>
<text x="312" y="130" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="bold" fill="#047857">已核实</text>
<rect x="40" y="152" width="280" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="40" y="152" width="6" height="36" rx="0" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.2"/>
<text x="54" y="168" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">18—30 岁占比</text>
<text x="54" y="182" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">仅有 18—34 岁 71.8%，不可改写口径</text>
<text x="312" y="174" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="bold" fill="#94a3b8">未验证</text>
<rect x="40" y="196" width="280" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="40" y="196" width="6" height="36" rx="0" fill="#b45309" stroke="#b45309" stroke-width="1.2"/>
<text x="54" y="212" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">跨城观演比例</text>
<text x="54" y="226" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">2024 年大型演唱会 64.2%；判定口径未公开</text>
<text x="312" y="218" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="bold" fill="#b45309">有条件采信</text>
<rect x="40" y="240" width="280" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="40" y="240" width="6" height="36" rx="0" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.2"/>
<text x="54" y="256" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">有多笔付款需求比例</text>
<text x="54" y="270" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">问卷只有样本内信号，不能当总体参数</text>
<text x="312" y="262" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="bold" fill="#94a3b8">未验证</text>
<rect x="360" y="108" width="280" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="360" y="108" width="6" height="36" rx="0" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.2"/>
<text x="374" y="124" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">数字工具接受比例</text>
<text x="374" y="138" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">需行为试点</text>
<text x="632" y="130" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="bold" fill="#94a3b8">未验证</text>
<rect x="360" y="152" width="280" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="360" y="152" width="6" height="36" rx="0" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.2"/>
<text x="374" y="168" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">产品边界内比例</text>
<text x="374" y="182" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">单人、人民币、不连接账户、不代付</text>
<text x="632" y="174" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="bold" fill="#94a3b8">未验证</text>
<rect x="680" y="108" width="280" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="680" y="108" width="6" height="36" rx="0" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.2"/>
<text x="694" y="124" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">人次去重与渠道可触达</text>
<text x="694" y="138" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">无用户标识数据</text>
<text x="952" y="130" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="end" font-weight="bold" fill="#94a3b8">未验证</text>
<text x="40" y="380" font-size="13" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1d4ed8">TAM（人次/年）</text>
<text x="40" y="400" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">观众人次 × 年龄占比 × 跨城比例 × 多笔需求比例</text>
<text x="360" y="380" font-size="13" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1d4ed8">SAM（人次/年）</text>
<text x="360" y="400" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">TAM × 数字工具接受比例 × 产品边界内比例</text>
<text x="680" y="380" font-size="13" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1d4ed8">SOM（人/年）</text>
<text x="680" y="400" font-size="9" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">SAM 去重后 × 首阶段渠道可触达比例</text>
<line x1="300" y1="386" x2="360" y2="386" stroke="#6b7280" stroke-width="1.4"/><polygon points="360,386 353,382 353,390" fill="#6b7280"/>
<line x1="620" y1="386" x2="680" y2="386" stroke="#6b7280" stroke-width="1.4"/><polygon points="680,386 673,382 673,390" fill="#6b7280"/>
<rect x="40" y="424" width="290" height="52" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
<text x="52" y="446" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">演出票房 616.55 亿元</text>
<text x="52" y="464" font-size="10" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">票款流水，不是软件市场收入</text>
<rect x="360" y="424" width="290" height="52" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
<text x="372" y="446" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">大型演出 4338.58 万人次</text>
<text x="372" y="464" font-size="10" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">观演次数，不是潜在用户数</text>
<rect x="680" y="424" width="290" height="52" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
<text x="692" y="446" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="bold" fill="#1f2937">本专科在校生 3953.96 万人</text>
<text x="692" y="464" font-size="10" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">在学人数，不是有跨城需求的人数</text>
<text x="40" y="500" font-size="12" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">按上表，TAM 的四个变量里 1 个已核实、1 个有条件采信、2 个没有证据；SAM／SOM 另加的三个变量也都未验证。</text>
<text x="40" y="522" font-size="12" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">因此本稿不给出 TAM／SAM／SOM 数值：填入任何比例都会得到“假设的乘积”，而不是市场。</text>
<text x="40" y="554" font-size="11" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">外部公开数据（非模拟）｜逐条来源与口径见附录 D</text>
</svg>
