<text x="100" y="366" font-size="12" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#1f2937">中间量保留 12 位小数，两端 34 位有效数字、ROUND_HALF_UP（D25、D50）；整数分只在进入金额计算时使用。</text>
