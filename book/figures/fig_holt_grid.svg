<text x="40" y="72" font-size="13" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" text-anchor="start" font-weight="normal" fill="#6b7280">网格选择、样本与回测门槛</text>
<rect x="80" y="120" width="300" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
